# 把 web/ 发布到 GitHub Pages：每次合并到 main 自动更新网站。
# 首次使用需在仓库 Settings → Pages 把 Source 设为「GitHub Actions」；未开启时跳过发布，不报错。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. Set Settings > Pages > Source to GitHub Actions, then re-run this workflow."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 每次发布给页面文件换上新的版本号，浏览器不会把旧的 app.js 和新的 model.mjs 混在一起用。
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" web/index.html web/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
